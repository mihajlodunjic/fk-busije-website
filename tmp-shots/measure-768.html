<!DOCTYPE html>
<html lang="sr"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Measure</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }

      iframe {
        display: block;
        width: 100%;
        height: 3200px;
        border: 0;
      }

      pre {
        margin: 0;
        padding: 8px;
        font: 12px/1.4 monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="out">{
  "viewportWidth": 735,
  "rootClientWidth": 720,
  "rootScrollWidth": 720,
  "bodyScrollWidth": 720,
  "offenderCount": 1,
  "offenders": [
    {
      "tag": "path",
      "className": {},
      "left": 12.52,
      "right": 788.85,
      "width": 776.33,
      "text": ""
    }
  ]
}</pre>
    <iframe id="page" src="/"></iframe>
    <script>
      const out = document.getElementById("out");
      const frame = document.getElementById("page");

      frame.addEventListener("load", () => {
        const doc = frame.contentDocument;
        const root = doc.documentElement;
        const body = doc.body;
        const viewportWidth = frame.clientWidth;

        const offenders = [...doc.querySelectorAll("body *")]
          .map((element) => {
            const rect = element.getBoundingClientRect();
            return {
              tag: element.tagName.toLowerCase(),
              className: element.className || "",
              left: Number(rect.left.toFixed(2)),
              right: Number(rect.right.toFixed(2)),
              width: Number(rect.width.toFixed(2)),
              text: (element.textContent || "").trim().replace(/\s+/g, " ").slice(0, 70)
            };
          })
          .filter((item) => item.right > root.clientWidth + 1 || item.left < -1)
          .slice(0, 25);

        out.textContent = JSON.stringify(
          {
            viewportWidth,
            rootClientWidth: root.clientWidth,
            rootScrollWidth: root.scrollWidth,
            bodyScrollWidth: body.scrollWidth,
            offenderCount: offenders.length,
            offenders
          },
          null,
          2
        );
      });
    </script>
  

</body></html>
